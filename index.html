<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="implimenting pituces in a social subspace."
    />
    <meta name="author" content="Adrian Sandoval" />
    <meta
      name="keywords"
      content="image sharing, social platform, HTML, friends interactions"
    />
    <title>Spots</title>
    <link rel="icon" href="assets/favicon.ico" />
    <script defer="defer" src="main.js"></script>
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="assets/94eae7a2c72012abf0e1.svg"
          alt="spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="assets/8a8db2b8a0a388f4e2f7.svg"
                alt="Pencil icon"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="assets/2fc47fd8e9a9bcd9612f.jpg"
              alt="Current users avatar"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="assets/e0ef387181c55a93f8b6.svg"
                alt="pencil icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="assets/975792ea68af0a3c209d.svg"
              alt="plus icon"
              class="profile__plus-btn"
            />New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template"
              ><li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div></li
            ></template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2026 &copy; Spots</p>
      </footer>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" name="newPostForm" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required />
              <span class="modal__error" id="card-image-input-error"></span
            ></label>
            <label for="card-caption-input" class="modal__label"
              >Caption
              <input
                id="card-caption-input"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30" />
              <span class="modal__error" id="card-caption-input-error"></span
            ></label>
            <button type="submit" class="modal__save-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" name="editProfileForm" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                id="profile-name-input"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40" />
              <span class="modal__error" id="profile-name-input-error"></span
            ></label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200" />
              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span
            ></label>
            <button type="submit" class="modal__save-btn">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        ></button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <div class="modal" id="edit-avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">Edit profile avatar</h2>
        <form class="modal__form" name="editAvatarForm" novalidate>
          <label for="profile-avatar-input" class="modal__label"
            >Profile Picture
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input"
              placeholder="Paste the link to an image"
              required />
            <span class="modal__error" id="profile-avatar-input-error"></span
          ></label>
          <button type="submit" class="modal__save-btn">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_delete"
        ></button>
        <h2 class="modal__title modal__title-delete">
          Are you sure you want to delete this image?
        </h2>
        <form class="modal__form" name="delete-form" novalidate>
          <div class="modal__wrapper">
            <button type="submit" class="modal__delete-btn">Delete</button>
            <button type="button" class="modal__cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
